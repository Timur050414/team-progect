<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team progect</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
        integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <header>

    </header>
    <main>
        <section class="registration" id="registration">
            <div class="registration__info">
                <p class="registration__eyebrow">Подія для майбутніх розробників</p>
                <h2>HTML і СSS</h2>
                <p>
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas, suscipit! Molestias architecto quasi sed ea!
                </p>

                <ul class="registration__facts">
                    <li>📅 18 жовтня</li>
                    <li>🕙 11:00–14:00</li>
                    <li>💻 Онлайн</li>
                </ul>
            </div>

            <form class="signup-form">
                <div class="form-field">
                    <label for="student-name">Ім'я</label>
                    <input type="text" id="student-name" name="student-name" placeholder="Наприклад, Марко" required>
                </div>

                <div class="form-field">
                    <label for="student-email">Email</label>
                    <input type="email" id="student-email" name="student-email" placeholder="name@example.com" required>
                </div>

                <div class="form-field">
                    <label for="student-age">Вік</label>
                    <input type="number" placeholder="your age" min="10" max="17" id="student-age" required>
                </div>

                <div class="form-field">
                    <label for="track">Обери напрям</label>
                    <select id="track" name="track" required>
                        <option value="">Обери варіант</option>
                        <option value="frontend">FrontEnd</option>
                        <option value="design">UI/UX Design</option>
                        <option value="qa">QA</option>
                        <option value="demodey">Demodey</option>
                    </select>
                </div>

                <label class="form-check">
                    <input type="checkbox" name="rules" required>
                    <span>Я погоджуюся з правилами участі</span>
                </label>

                <button type="submit">Зареєструватися</button>
            </form>
        </section>
    </main>
    <footer>

    </footer>
</body>

</html>
